[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creep_model"
version = "0.1.0"
description = "Non-linear modeling and processing of materials science creep tests"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",      
]

[project.optional-dependencies]
# These are only installed when you are developing/testing the code
dev = [
    "pytest>=7.0.0",
    "pytest-cov",           
]